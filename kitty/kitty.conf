font_family             JetBrainsMono Nerd Font
bold_font               JetBrainsMono Nerd Font Bold
italic_font             JetBrainsMono Nerd Font Italic
bold_italic_font        JetBrainsMono Nerd Font Bold Italic
font_size               12.0


disable_ligatures       cursor


modify_font             cell_height 110%


cursor_shape            beam
cursor_beam_thickness   1.8
cursor_blink_interval   0.5
cursor_stop_blinking_after 15.0
cursor_trail            3


scrollback_lines        10000
wheel_scroll_multiplier 3.0


url_style               curly
open_url_with           default
detect_urls             yes
copy_on_select          clipboard
mouse_hide_wait         3.0


remember_window_size    yes
initial_window_width    1100
initial_window_height   700
window_padding_width    10
placement_strategy      center
enabled_layouts         splits,stack
confirm_os_window_close 0

background_opacity      1
dynamic_background_opacity yes


tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

enable_audio_bell       no
visual_bell_duration    0.0


repaint_delay           8
input_delay             2
sync_to_monitor         yes

map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard

map ctrl+shift+t        new_tab_with_cwd
map ctrl+shift+w        close_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab

map ctrl+shift+enter    launch --location=split --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus    launch --location=hsplit --cwd=current

map ctrl+shift+h        neighboring_window left
map ctrl+shift+l        neighboring_window right
map ctrl+shift+k        neighboring_window up
map ctrl+shift+j        neighboring_window down

map ctrl+equal          change_font_size all +1.0
map ctrl+minus          change_font_size all -1.0
map ctrl+0              change_font_size all 0

map ctrl+shift+f5       load_config_file

foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

cursor                  #F5E0DC
cursor_text_color       #1E1E2E
cursor_trail_color      #F5E0DC

url_color               #F5E0DC

active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

wayland_titlebar_color  system
macos_titlebar_color    system

active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

mark1_foreground        #1E1E2E
mark1_background        #B4BEFE
mark2_foreground        #1E1E2E
mark2_background        #CBA6F7
mark3_foreground        #1E1E2E
mark3_background        #74C7EC

