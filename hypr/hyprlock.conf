general {
    compositor_fade = true
}

background {
    monitor = DP-1
    path = ~/.config/hypr/Wallpaper/1.jpg
    color = rgba(0, 0, 0, 0.0)

    blur_passes = 2
    blur_size = 7
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %-d"
    color = rgba(d8e5f0e6)
    font_size = 22
    font_family = SF Pro Display Semibold
    position = 0, -70
    halign = center
    valign = top
}


label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(d8e5f0f2)
    font_size = 130
    font_family = SF Pro Display Bold
    position = 0, -100
    halign = center
    valign = top
}


image {
    monitor = DP-1
    path = ~/.face
    size = 64
    rounding = -1
    border_size = 0
    position = 0, 150
    halign = center
    valign = bottom
}


label {
    monitor = DP-1
    text = $USER
    color = rgb(d8e5f0)
    font_size = 14
    font_family = SF Pro Text Semibold
    position = 0, 115
    halign = center
    valign = bottom
}


input-field {
    monitor = DP-1
    size = 200, 34
    outline_thickness = 0
    rounding = -1
    inner_color = rgba(d8e5f033)
    font_color = rgb(d8e5f0)
    check_color = rgba(ffd86666)
    fail_color = rgba(ff4d6d66)
    dots_size = 0.2
    dots_spacing = 0.35
    fade_on_empty = false
    placeholder_text = <span foreground="##d8e5f0aa">Enter Password</span>
    font_family = SF Pro Text
    position = 0, 60
    halign = center
    valign = bottom
}
    

